name: Validate library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install pyyaml jsonschema
      - name: Check control coverage matrix is current
        run: python3 scripts/build-coverage-matrix.py --check
      - name: Validate metadata, links, and catalog consistency
        run: python3 scripts/validate-library.py
